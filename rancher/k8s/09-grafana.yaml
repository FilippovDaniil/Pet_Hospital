# =============================================================
# 09-grafana.yaml — Grafana: визуализация логов и метрик
# =============================================================
# Grafana читает данные из двух источников:
#   - Loki (логи)       → datasource url: http://loki:3100
#   - Prometheus (метрики) → datasource url: http://prometheus:9090
#
# Автоматическая настройка при старте через provisioning:
#   - /etc/grafana/provisioning/datasources/  → источники данных
#   - /etc/grafana/provisioning/dashboards/   → провайдер дашбордов
#   - /etc/grafana/provisioning/dashboards/json/ → JSON файлы дашбордов
#
# ПАТТЕРН МОНТИРОВАНИЯ (важно понять!):
# В K8s нельзя смонтировать два ConfigMap в одну директорию —
# второй перезатрёт первый. Поэтому:
#   ConfigMap grafana-dashboard-config → /dashboards/ (содержит dashboards.yml)
#   ConfigMap grafana-dashboards       → /dashboards/json/ (содержит *.json файлы)
# В dashboards.yml прописан path: /dashboards/json — Grafana ищет JSON там.
#
# Доступ: http://localhost:30300  admin / admin
# =============================================================

# --- РЕСУРС 1: ConfigMap — источники данных (datasources) ---
# Grafana автоматически добавит эти datasources при старте,
# не нужно вручную настраивать в UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: pet-hospital
data:
  # Ключи = имена файлов в /etc/grafana/provisioning/datasources/
  loki.yml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki               # Уникальный ID — на него ссылаются панели дашбордов
        access: proxy           # Grafana server проксирует запросы (не браузер напрямую)
        url: http://loki:3100   # K8s DNS-имя Service Loki внутри namespace
        isDefault: true         # Loki = datasource по умолчанию
        editable: true

  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus         # Уникальный ID — на него ссылаются панели дашбордов
        access: proxy
        url: http://prometheus:9090  # K8s DNS-имя Service Prometheus
        isDefault: false
        editable: true
        jsonData:
          timeInterval: '15s'   # Минимальный интервал запросов = scrape_interval

---
# --- РЕСУРС 2: ConfigMap — провайдер дашбордов ---
# Описывает ГДЕ искать JSON-файлы дашбордов.
# path указывает на подпапку /json — там лежат файлы из ConfigMap grafana-dashboards.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-config
  namespace: pet-hospital
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'Pet Hospital'
        orgId: 1
        folder: 'Pet Hospital'    # Папка в Grafana UI
        type: file                # Тип провайдера — файловая система
        disableDeletion: false
        updateIntervalSeconds: 10 # Проверять обновления файлов каждые 10 секунд
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/json  # ПОДПАПКА для JSON файлов!
          # Не /dashboards/ — там лежит только dashboards.yml,
          # и второй ConfigMap не перезатрёт этот файл.

---
# --- РЕСУРС 3: ConfigMap — JSON файлы дашбордов ---
# Дашборды экспортированы из Grafana UI → Settings → JSON Model.
# Grafana автоматически загрузит их при старте.
# uid в JSON должен быть уникальным в Grafana (pet-hospital-logs, pet-hospital-metrics).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: pet-hospital
data:
  logs.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Логи приложения Pet Hospital (Loki)",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 1, "fillOpacity": 10 }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "ERROR" }, "properties": [{ "id": "color", "value": { "fixedColor": "#e02f44", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "WARN" },  "properties": [{ "id": "color", "value": { "fixedColor": "#ff9830", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "INFO" },  "properties": [{ "id": "color", "value": { "fixedColor": "#5794f2", "mode": "fixed" } }] }
            ]
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "editorMode": "code",
              "expr": "sum by (level) (count_over_time({app=\"pet-hospital\"}[$__interval]))",
              "legendFormat": "{{level}}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Объём логов по уровню",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 20, "w": 24, "x": 0, "y": 8 },
          "id": 2,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "editorMode": "code",
              "expr": "{app=\"pet-hospital\"}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Все логи",
          "type": "logs"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 14, "w": 24, "x": 0, "y": 28 },
          "id": 3,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "editorMode": "code",
              "expr": "{app=\"pet-hospital\", level=\"ERROR\"}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Только ошибки (ERROR)",
          "type": "logs"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "tags": ["pet-hospital", "logs"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Pet Hospital — Logs",
      "uid": "pet-hospital-logs",
      "version": 1,
      "weekStart": ""
    }
  metrics.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
