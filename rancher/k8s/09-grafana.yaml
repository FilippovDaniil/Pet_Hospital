---
# --- РЕСУРС 4: PersistentVolumeClaim ---
# Grafana хранит на диске: SQLite БД (настройки, пользователи, плагины).
# Данные сессий, алертов, аннотаций — всё в /var/lib/grafana.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: pet-hospital
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi            # SQLite + плагины занимают < 50 MB обычно

---
# --- РЕСУРС 5: Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: pet-hospital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # Ждём Loki и Prometheus перед стартом Grafana.
      # Без этого datasources могут не пройти проверку при инициализации.
      initContainers:
        - name: wait-for-loki
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z loki 3100; do sleep 2; done
        - name: wait-for-prometheus
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z prometheus 9090; do sleep 2; done

      containers:
        - name: grafana
          image: grafana/grafana:10.2.3
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"              # Логин администратора
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"              # Пароль (для продакшена менять!)
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"              # Запретить регистрацию новых пользователей
            - name: GF_INSTALL_PLUGINS
              value: ""                   # Дополнительные плагины (не нужны)

          volumeMounts:
            # ПОРЯДОК volumeMounts важен — описание паттерна:
            - name: grafana-storage
              mountPath: /var/lib/grafana             # PVC: SQLite и плагины

            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              # ConfigMap grafana-datasources → loki.yml и prometheus.yml

            - name: grafana-dashboard-config
              mountPath: /etc/grafana/provisioning/dashboards
              # ConfigMap grafana-dashboard-config → только dashboards.yml
              # (нельзя монтировать JSON сюда же — они бы скрыли dashboards.yml)

            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards/json
              # ConfigMap grafana-dashboards → logs.json и metrics.json
              # Это ПОДПАПКА — не конфликтует с dashboards.yml выше
              # dashboards.yml ищет файлы по пути /dashboards/json → находит их тут

      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-config
          configMap:
            name: grafana-dashboard-config
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards

---
# --- РЕСУРС 6: Service с NodePort ---
# NodePort 30300: 3000 → добавляем "30" спереди → 30300
# Доступ: http://localhost:30300  (admin / admin)
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: pet-hospital
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30301           # 30300 занят namespace marketplace
  type: NodePort
