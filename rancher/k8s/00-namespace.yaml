# =============================================================
# 00-namespace.yaml — Изолированное пространство имён
# =============================================================
# Namespace — виртуальный кластер внутри K8s.
# Все ресурсы проекта (поды, сервисы, конфиги) живут в нём,
# изолированы от других проектов в том же кластере.
# Применяется ПЕРВЫМ, остальные файлы ссылаются на это имя.
# =============================================================

apiVersion: v1       # Версия K8s API для ресурса Namespace
kind: Namespace      # Тип ресурса
metadata:
  name: pet-hospital # Имя namespace — используется во всех остальных файлах
