# =============================================================
# 06-kafdrop.yaml — Kafdrop: веб-интерфейс для мониторинга Kafka
# =============================================================
# Kafdrop позволяет через браузер:
#   - просматривать топики и их партиции
#   - читать сообщения из топиков (отладка событий)
#   - видеть consumer groups и их offsets
#
# Доступ: http://localhost:30009
# NodePort 30009 выбран по паттерну: 9000 → 30009 (добавляем "3" спереди)
#
# initContainer: Kafdrop должен запуститься ПОСЛЕ Kafka.
# Без ожидания Kafdrop не найдёт брокер и покажет ошибку при открытии.
# =============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafdrop
  namespace: pet-hospital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafdrop
  template:
    metadata:
      labels:
        app: kafdrop
    spec:
      # Ждём Kafka перед стартом Kafdrop
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z kafka 29092; do sleep 2; done
          # Проверяем внутренний порт 29092, а не 9092

      containers:
        - name: kafdrop
          image: obsidiandynamics/kafdrop:latest  # Официальный образ Kafdrop
          ports:
            - containerPort: 9000   # Веб-интерфейс Kafdrop
          env:
            - name: KAFKA_BROKERCONNECT
              value: "kafka:29092"  # DNS-имя Service Kafka (из 05-kafka.yaml)
            - name: JVM_OPTS
              value: "-Xms32M -Xmx64M"  # Ограничиваем память JVM (для учебного окружения)
              # Без ограничения Kafdrop может запросить 256M+ heap

---
# NodePort Service: делает Kafdrop доступным с хост-машины
# NodePort выставляет порт на КАЖДОЙ ноде кластера Rancher Desktop
# http://localhost:30009 → Service :9000 → Pod :9000
apiVersion: v1
kind: Service
metadata:
  name: kafdrop
  namespace: pet-hospital
spec:
  selector:
    app: kafdrop
  ports:
    - port: 9000        # Порт внутри кластера
      targetPort: 9000  # Порт контейнера
      nodePort: 30009   # Порт на хост-машине (диапазон 30000–32767)
  type: NodePort        # NodePort = доступен снаружи кластера через localhost:30009
