# =============================================================
# 01-secrets.yaml — Секреты (пароли и чувствительные данные)
# =============================================================
# Secret в K8s хранит данные в base64 (не шифрует!).
# Главная ценность — Deployment не содержит пароль в открытом виде,
# а ссылается на секрет. При смене пароля меняем только этот файл.
#
# stringData: — удобная форма, K8s сам кодирует в base64 при сохранении.
# data: — принимает уже закодированные значения.
#
# ВАЖНО: не коммить реальные пароли в git! Для продакшена
# использовать Vault, External Secrets Operator или Sealed Secrets.
# =============================================================

apiVersion: v1
kind: Secret
metadata:
  name: pet-hospital-secrets  # Имя секрета — на него ссылаются Deployments
  namespace: pet-hospital
type: Opaque                  # Тип Opaque = произвольные данные (не TLS, не токен)
stringData:
  postgres-password: "1234"   # Пароль PostgreSQL; используется в 02-postgres.yaml и 10-app.yaml
