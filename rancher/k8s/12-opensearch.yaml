# =============================================================
# 12-opensearch.yaml — OpenSearch для поиска (single-node, без TLS)
# =============================================================
# DISABLE_SECURITY_PLUGIN=true — отключает TLS и basic auth.
# Для dev-окружения безопасно; в prod включить security и сертификаты.
#
# OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m — ограничение heap.
# OpenSearch по умолчанию берёт 50% RAM, что много для ноутбука.
# 512m достаточно для dev/учебного проекта.
#
# vm.max_map_count: OpenSearch требует >= 262144.
# initContainer меняет значение через sysctl (нужен privileged).
# =============================================================

# --- РЕСУРС 1: PersistentVolumeClaim ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensearch-pvc
  namespace: pet-hospital
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# --- РЕСУРС 2: Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: pet-hospital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      # vm.max_map_count нужен для Lucene (движок индексов OpenSearch).
      # Без этого OpenSearch не запустится: bootstrap checks fail.
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true

      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.17.0
          ports:
            - containerPort: 9200
            - containerPort: 9600
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3

      volumes:
        - name: opensearch-data
          persistentVolumeClaim:
            claimName: opensearch-pvc

---
# --- РЕСУРС 3: ClusterIP Service ---
# Другие поды (hospital-app) обращаются по DNS: opensearch:9200
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: pet-hospital
spec:
  selector:
    app: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
  type: ClusterIP
