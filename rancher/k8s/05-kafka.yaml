# =============================================================
# 05-kafka.yaml — Apache Kafka: брокер сообщений
# =============================================================
# Kafka используется для асинхронных событий:
#   patient-events, admission-events, paid-service-events и др.
#
# КЛЮЧЕВАЯ СЛОЖНОСТЬ — два listener'а:
#
#   PLAINTEXT://kafka:29092      — для подов ВНУТРИ кластера K8s
#   PLAINTEXT_HOST://localhost:9092 — для доступа с хоста через port-forward
#
# Почему два listener'а?
# KAFKA_ADVERTISED_LISTENERS — это адреса, которые Kafka сообщает
# клиентам при подключении ("bootstrap"). Если приложение подключается
# к kafka:29092, Kafka отвечает: "мой адрес — kafka:29092" (resolvable).
# Если бы был только PLAINTEXT_HOST://localhost, внутренние поды
# получили бы localhost и не смогли бы подключиться.
#
# initContainer: Kafka НЕ запустится если ZooKeeper не готов.
# Без этого ожидания под войдёт в CrashLoopBackOff.
# =============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: pet-hospital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # КРИТИЧНО для Confluent Kafka в K8s:
      # K8s автоматически инжектирует env-переменные для всех Services в namespace.
      # Service с именем "kafka" создаёт переменную KAFKA_PORT=tcp://ip:29092 во всех подах.
      # Confluent Kafka-образ интерпретирует любую переменную KAFKA_* как конфиг-параметр.
      # KAFKA_PORT конфликтует с внутренней конфигурацией → Exit Code 1.
      # Решение: enableServiceLinks: false — отключить инжекцию сервисных переменных.
      enableServiceLinks: false

      # initContainer выполняется ДО основного контейнера.
      # Пока ZooKeeper недоступен на порту 2181 — Kafka не стартует.
      # nc -z = "zero-I/O mode": просто проверяет, открыт ли порт (не шлёт данные)
      initContainers:
        - name: wait-for-zookeeper
          image: busybox:1.36       # Минимальный образ с утилитой nc (netcat)
          command:
            - sh
            - -c
            - until nc -z zookeeper 2181; do sleep 2; done
          # Цикл: пробуй подключиться → если не получилось → жди 2с → повтори

      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          ports:
            - containerPort: 29092  # Внутренний listener (для других подов K8s)
            - containerPort: 9092   # Внешний listener (для хоста через port-forward)
          env:
            - name: KAFKA_BROKER_ID
              value: "1"            # Уникальный ID брокера в кластере (у нас один брокер)

            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"  # DNS-имя ZooKeeper Service из 04-zookeeper.yaml

            # Маппинг имён listener'ов на протоколы безопасности
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
              # PLAINTEXT = без TLS, PLAINTEXT_HOST = тоже без TLS, но другое имя

            # Адреса, на которых Kafka СЛУШАЕТ входящие подключения
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092"
              # 0.0.0.0 = слушать на всех сетевых интерфейсах контейнера

            # Адреса, которые Kafka СООБЩАЕТ клиентам (должны быть resolvable!)
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
              # kafka:29092 — DNS-имя K8s Service (resolvable внутри кластера)
              # localhost:9092 — для kubectl port-forward с хост-машины

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"    # Какой listener используют брокеры между собой

            # Следующие три: настройки репликации для кластера из 1 брокера
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"            # __consumer_offsets — системный топик, replication=1
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"            # __transaction_state — для транзакционного продюсера
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"            # ISR (in-sync replicas) мин=1 (для 1 брокера)

            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"         # Топики создаются автоматически при первом обращении
              # (KafkaConfig.java создаёт их явно, но auto-create — страховка)

---
# Service: предоставляет стабильный адрес для Kafka.
# Приложение подключается через SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
# Kafdrop подключается через KAFKA_BROKERCONNECT=kafka:29092
apiVersion: v1
kind: Service
metadata:
  name: kafka                  # DNS-имя — совпадает с docker-compose service name
  namespace: pet-hospital
spec:
  selector:
    app: kafka
  ports:
    - name: internal           # Именованный порт — удобно для отладки
      port: 29092              # Для подов внутри кластера
      targetPort: 29092
    - name: external
      port: 9092               # Для хоста через kubectl port-forward
      targetPort: 9092
  type: ClusterIP
