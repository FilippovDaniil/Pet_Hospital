# =============================================================
# 07-loki.yaml — Grafana Loki: агрегация и хранение логов
# =============================================================
# Loki — система хранения логов, аналог Elasticsearch но легче.
# Приложение (через loki4j appender в logback-spring.xml) отправляет
# логи по HTTP на http://loki:3100/loki/api/v1/push
#
# Grafana читает логи из Loki через datasource (настроен в 09-grafana.yaml).
#
# КРИТИЧНО: securityContext.runAsUser: 0
# Loki 2.x создаёт директории от UID 10001, но PVC создаётся с правами root.
# При первом запуске Loki пытается писать в /loki → Permission denied.
# Решение: запускать от root (user: "0"), как в оригинальном docker-compose.
#
# Service type: ClusterIP (только внутри кластера).
# Loki не должен быть доступен снаружи — только Grafana и приложение.
# =============================================================

# --- РЕСУРС 1: ConfigMap с конфигурацией Loki ---
# ConfigMap хранит текстовые данные, которые монтируются как файлы в pod.
# Это позволяет менять конфигурацию без пересборки образа.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: pet-hospital
data:
  config.yaml: |              # Ключ "config.yaml" станет файлом /etc/loki/config.yaml
    auth_enabled: false       # Отключаем авторизацию (для учебного проекта)

    server:
      http_listen_port: 3100  # HTTP API (пуш логов, health check, query)
      grpc_listen_port: 9096  # gRPC API (внутренние компоненты Loki)

    common:
      instance_addr: 127.0.0.1  # IP адрес этого экземпляра Loki (для single-mode)
      path_prefix: /loki         # Все данные хранятся в /loki/* на PVC
      storage:
        filesystem:
          chunks_directory: /loki/chunks  # Сами данные логов (чанки)
          rules_directory: /loki/rules    # Правила алертинга (не используем)
      replication_factor: 1     # Одна копия данных (single-instance, без HA)
      ring:
        kvstore:
          store: inmemory       # Реестр экземпляров в памяти (для одного узла)

    schema_config:
      configs:
        - from: 2020-10-24      # С этой даты применяется данная схема
          store: tsdb           # TSDB (Time Series DB) — новый индекс v2.9+
          object_store: filesystem  # Хранить чанки на диске (не в S3/GCS)
          schema: v13           # Версия схемы индекса
          index:
            prefix: index_      # Префикс файлов индекса
            period: 24h         # Один файл индекса = 1 день

    limits_config:
      reject_old_samples: true          # Отклонять логи старше max_age
      reject_old_samples_max_age: 168h  # 7 дней — максимальный возраст лога
      ingestion_rate_mb: 16             # Лимит скорости приёма: 16 MB/s
      ingestion_burst_size_mb: 32       # Кратковременный всплеск: до 32 MB

    compactor:
      working_directory: /loki/compactor  # Компрессия старых чанков

    ruler:
      alertmanager_url: http://localhost:9093  # Адрес AlertManager (не настроен)

---
# --- РЕСУРС 2: PersistentVolumeClaim ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-pvc
  namespace: pet-hospital
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi              # 2 GB для 7 дней логов активного сервиса

---
# --- РЕСУРС 3: Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: pet-hospital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      # КРИТИЧНЫЙ securityContext: запускаем от root (UID 0)
      # Без этого Loki не сможет писать в /loki (PVC создан с правами root)
      securityContext:
        runAsUser: 0            # UID 0 = root внутри контейнера

      containers:
        - name: loki
          image: grafana/loki:2.9.0
          ports:
            - containerPort: 3100
          args:
            - -config.file=/etc/loki/config.yaml  # Путь к смонтированному конфигу

          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki      # ConfigMap монтируется как директория
              # В /etc/loki появится файл config.yaml (ключ из ConfigMap)
            - name: loki-storage
              mountPath: /loki          # PVC монтируется как директория данных

          # Loki может долго инициализировать TSDB при первом запуске
          readinessProbe:
            httpGet:
              path: /ready              # Endpoint готовности встроен в Loki
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10

      volumes:
        - name: loki-config
          configMap:
            name: loki-config          # Подключаем ConfigMap с именем loki-config
        - name: loki-storage
          persistentVolumeClaim:
            claimName: loki-pvc        # Подключаем PVC с данными

---
# --- РЕСУРС 4: Service ---
# Loki доступен ТОЛЬКО внутри кластера:
#   - приложение пушит логи на http://loki:3100/loki/api/v1/push
#   - Grafana читает данные на http://loki:3100
apiVersion: v1
kind: Service
metadata:
  name: loki                    # DNS-имя — совпадает с docker-compose service name
  namespace: pet-hospital       # Важно: logback и Grafana datasource ожидают имя "loki"
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
  type: ClusterIP
